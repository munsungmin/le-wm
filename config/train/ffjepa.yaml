defaults:
  - lewm
  - override data: pusht
  - override forward: le_jepa
  - override model: ff_jepa
  - _self_

output_model_name: ffjepa_${hydra:runtime.choices.model/planner}

num_workers: 6
train_split: 0.9
seed: 3072
img_size: 224
embed_dim: 192
resume: false
resume_dir: null

trainer:
  max_epochs: 100
  devices: auto
  accelerator: gpu
  precision: bf16
  gradient_clip_val: 1.0

loader:
  batch_size: 128
  num_workers: ${num_workers}
  persistent_workers: True
  prefetch_factor: 3
  pin_memory: True

optimizer:
  type: AdamW
  lr: 5e-5
  weight_decay: 1e-3

