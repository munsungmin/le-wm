# @package _global_
# Local launcher configuration (no SLURM)

defaults:
  - override /hydra/launcher: basic

run_timestamp: ${utc_timestamp:}
run_id: ${data.env}_${output_model_name}_${seed}_${run_timestamp}
run_dir: ${experiment_dir:${output_root},${run_id},${resume_dir},${resume}}

hydra:
  run:
    dir: ${run_dir}
  sweep:
    dir: ${output_root}
    subdir: ${run_id}
  job:
    chdir: False

wandb:
  enabled: True
  config:
    entity: lewm
    project: lewm
    name: ${run_id}
    id: ${run_id}
    resume: allow
    log_model: False
    save_dir: ${run_dir}
