env: pusht
environment_id: swm/PushT-v1
environment_package: stable-worldmodel
available_keys: [pixels, action, proprio, state]
dataset:
  num_steps: ${data.preprocessing.dataset.num_steps}
  frameskip: ${data.preprocessing.dataset.frameskip}
  name: /data/sungmin/lewm/datasets/pusht_expert_train.h5
  keys_to_load: ${oc.create:${eval:'[k for k in ${data.available_keys} if k in ${data.preprocessing.input_spec.keys_from_model}]'}}
  keys_to_cache: ${oc.create:${eval:'[k for k in ${data.dataset.keys_to_load} if not k.startswith("pixels")]'}}
