# @package _global_

world_name: tworoom
world:
  env_name: swm/TwoRoom-v1
  num_envs: ${eval.num_eval}
  max_episode_steps: ???
dataset:
  stats: ${eval.dataset_name}
  keys_to_cache:
  - action
  - proprio
eval:
  dataset_name: tworoom
  callables:
  - method: _set_state
    args:
      state:
        value: proprio
  - method: _set_goal_state
    args:
      goal_state:
        value: goal_proprio
output:
  filename: tworoom_results.txt
