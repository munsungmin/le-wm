# @package _global_

world_name: reacher
world:
  env_name: swm/ReacherDMControl-v0
  num_envs: ${eval.num_eval}
  max_episode_steps: ???
  task: qpos_match
dataset:
  stats: ${eval.dataset_name}
  keys_to_cache:
  - action
eval:
  dataset_name: dmc/reacher_random
  callables:
  - method: set_state
    args:
      qpos:
        value: qpos
      qvel:
        value: qvel
  - method: set_target_qpos
    args:
      target_qpos:
        value: goal_qpos
output:
  filename: dmc_results.txt
