defaults:
  - launcher: local
  - world: pusht
  - pipeline: lewm
  - solver: cem
  - policy: random
  - _self_

seed: 42

wandb:
  enabled: True
  config:
    entity: lewm
    project: lewm
    resume: allow
    log_model: False
    job_type: evaluation

plan_config:
  horizon: 5
  receding_horizon: 5
  action_block: 5

eval:
  num_eval: ${pipeline.num_eval}
  goal_offset_steps: ${pipeline.goal_offset_steps}
  eval_budget: ${pipeline.eval_budget}
  img_size: 224

output:
  model: null # defaults to the selected policy; may label a checkpoint/retraining run
  depth: 0
  intervention: none
  interference_k: 0

sampler:
  _target_: scripts.pipeline.eval.${world_name}.${pipeline.name}_sample
  _partial_: true
  goal_offset_steps: ${eval.goal_offset_steps}
  num_eval: ${eval.num_eval}
  seed: ${seed}
  criterion: ${criterion}

criterion:
  _target_: scripts.pipeline.eval.${world_name}.${pipeline.name}_criterion
  _partial_: true
