defaults:
  - launcher: local
  - solver: cem
  - scenario: short
  - _self_

world:
  env_name: swm/PushT-v1
  num_envs: ${eval.num_eval}
  max_episode_steps: ${eval.eval_budget}

dataset:
  stats: ${eval.dataset_name}
  keys_to_cache:
    - action
    - proprio
    - state

seed: 42
policy: pusht/lewm # checkpoint path relative to STABLEWM_HOME, or random

plan_config:
  horizon: 5
  receding_horizon: 5
  action_block: 5 # frameskip

# evaluation from dataset (replay expert trajectories)
eval:
  img_size: 224
  dataset_name: pusht_expert_train
  save_video: false
  success:
    position_tolerance_px: 20.0
    angle_tolerance_deg: 5.0
  callables:
    # -- set state
    - method: _set_state
      args:
        state:
          value: state
    # -- set goal state
    - method: _set_goal_state
      args:
        goal_state:
          value: goal_state
          
output:
  root: results

record:
  env: pusht
  model: lewm_ckpt
  checkpoint_step: pretrained
